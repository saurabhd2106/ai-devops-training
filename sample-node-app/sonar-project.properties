sonar.projectKey=sonarqube-node-demo
sonar.projectName=sonarqube-node-demo
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=__tests__
# Keep tests out of sonar.sources so files are not indexed twice.
sonar.exclusions=node_modules/**,coverage/**,reports/**,__tests__/**
sonar.test.inclusions=__tests__/**/*
sonar.javascript.lcov.reportPaths=coverage/lcov.info
