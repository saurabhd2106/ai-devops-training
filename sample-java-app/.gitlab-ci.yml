# GitLab CI equivalent of sample-java-app/Jenkinsfile
# (build → test → AI → package → Sonar → AI → S3 publish)
# Plus GitLab-native extras: publish:artifacts and publish:package-registry.
#
# Settings → CI/CD → General pipelines → CI/CD configuration file:
#   Monorepo:  sample-java-app/.gitlab-ci.yml
#   App-only:  .gitlab-ci.yml
#
# Variables (Settings → CI/CD → Variables; see README.md):
#   Required: SONAR_HOST_URL, SONAR_TOKEN
#   For S3:   S3_BUCKET; AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY if no instance profile
#   Optional: SONAR_PROJECT_KEY, AWS_REGION / AWS_DEFAULT_REGION, BEDROCK_*

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - build
  - test
  - ai-tests
  - package
  - sonarqube
  - ai-review
  - publish

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --show-version --no-transfer-progress"
  ARTIFACT_ID: "sonarqube-java-demo"
  JAR_NAME: "sonarqube-java-demo-0.0.1-SNAPSHOT.jar"
  SONAR_PROJECT_KEY: "sonarqube-java-demo"
  AWS_REGION: "us-east-1"
  AWS_DEFAULT_REGION: "us-east-1"
  AI_OUT_DIR: "$CI_PROJECT_DIR/ai-review"
  WORKSPACE: "$CI_PROJECT_DIR"
  FF_USE_FASTZIP: "true"

# Resolve APP_DIR / AI_SCRIPT (monorepo vs app-only). Call from project root.
.resolve_app: &resolve_app |
  set -euo pipefail
  cd "${CI_PROJECT_DIR}"
  if [ -f sample-java-app/pom.xml ]; then
    export APP_DIR=sample-java-app
  elif [ -f pom.xml ]; then
    export APP_DIR=.
  else
    echo "Neither sample-java-app/pom.xml nor pom.xml found"; exit 1
  fi
  if [ -f ci/ai/ai-review.sh ]; then
    export AI_SCRIPT="${CI_PROJECT_DIR}/ci/ai/ai-review.sh"
  elif [ -f "${APP_DIR}/ci/ai/ai-review.sh" ]; then
    export AI_SCRIPT="${CI_PROJECT_DIR}/${APP_DIR}/ci/ai/ai-review.sh"
  else
    export AI_SCRIPT=
  fi
  export AI_OUT_DIR="${CI_PROJECT_DIR}/ai-review"
  export WORKSPACE="${CI_PROJECT_DIR}"
  export AWS_DEFAULT_REGION="${AWS_REGION:-us-east-1}"
  mkdir -p sample-java-app/target/surefire-reports target/surefire-reports sample-java-app/target/classes target/classes ai-review
  echo "APP_DIR=${APP_DIR} AI_SCRIPT=${AI_SCRIPT:-'(not found)'}"

.install_aws: &install_aws |
  apt-get update -qq && apt-get install -y -qq curl unzip ca-certificates git >/dev/null
  curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
  unzip -q /tmp/awscliv2.zip -d /tmp && /tmp/aws/install -i /usr/local/aws-cli -b /usr/local/bin

default:
  image: maven:3.9-eclipse-temurin-26
  interruptible: true
  cache:
    key: "maven-${CI_COMMIT_REF_SLUG}"
    paths:
      - .m2/repository

# --- Build -------------------------------------------------------------------

build:
  stage: build
  script:
    - *resolve_app
    - cd "${APP_DIR}" && mvn $MAVEN_CLI_OPTS -DskipTests compile
  artifacts:
    name: "classes-${CI_COMMIT_SHORT_SHA}"
    expire_in: 1 day
    paths:
      - sample-java-app/target/classes/
      - sample-java-app/pom.xml
      - target/classes/
      - pom.xml

# --- Test --------------------------------------------------------------------

test:
  stage: test
  needs:
    - job: build
      artifacts: true
  script:
    - *resolve_app
    # pom.xml sets surefire testFailureIgnore=true because this demo seeds a failing test.
    - cd "${APP_DIR}" && mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    name: "tests-${CI_COMMIT_SHORT_SHA}"
    expire_in: 1 week
    reports:
      junit:
        - sample-java-app/target/surefire-reports/TEST-*.xml
        - target/surefire-reports/TEST-*.xml
    paths:
      - sample-java-app/target/
      - target/

# --- AI Test Review ----------------------------------------------------------

.ai_job: &ai_job
  image: python:3.12-slim
  allow_failure: true
  before_script:
    - *install_aws

ai:tests:
  <<: *ai_job
  stage: ai-tests
  needs:
    - job: test
      artifacts: true
  script:
    - *resolve_app
    - |
      if [ -z "${AI_SCRIPT}" ]; then
        echo "AI script not found; skipping AI Test Review"
        exit 0
      fi
      mkdir -p "${AI_OUT_DIR}"
      chmod +x "${AI_SCRIPT}"
      "${AI_SCRIPT}" tests || true
  artifacts:
    when: always
    paths:
      - ai-review/
    expire_in: 1 week

# --- Package -----------------------------------------------------------------

package:
  stage: package
  needs:
    - job: test
      artifacts: true
    - job: ai:tests
      artifacts: true
      optional: true
  script:
    - *resolve_app
    - cd "${APP_DIR}" && mvn $MAVEN_CLI_OPTS -DskipTests package
    - test -f "${CI_PROJECT_DIR}/${APP_DIR}/target/${JAR_NAME}"
  artifacts:
    name: "package-${CI_COMMIT_SHORT_SHA}"
    expire_in: 1 week
    paths:
      - sample-java-app/target/
      - target/
      - ai-review/

# --- SonarQube ---------------------------------------------------------------

sonarqube:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  needs:
    - job: package
      artifacts: true
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-${CI_COMMIT_REF_SLUG}"
    paths:
      - .sonar/cache
  script:
    - *resolve_app
    - |
      if [ -z "${SONAR_HOST_URL}" ] || [ -z "${SONAR_TOKEN}" ]; then
        echo "SONAR_HOST_URL and SONAR_TOKEN must be set as CI/CD variables."
        exit 1
      fi
    - |
      cd "${APP_DIR}"
      sonar-scanner \
        -Dsonar.host.url="${SONAR_HOST_URL}" \
        -Dsonar.token="${SONAR_TOKEN}" \
        -Dsonar.projectKey="${SONAR_PROJECT_KEY:-sonarqube-java-demo}" \
        -Dsonar.projectName="${SONAR_PROJECT_KEY:-sonarqube-java-demo}" \
        -Dsonar.sources=src/main/java \
        -Dsonar.tests=src/test/java \
        -Dsonar.java.binaries=target/classes \
        -Dsonar.java.test.binaries=target/test-classes \
        -Dsonar.junit.reportPaths=target/surefire-reports \
        -Dsonar.sourceEncoding=UTF-8
  allow_failure: true
  rules:
    - if: $SONAR_HOST_URL && $SONAR_TOKEN

# --- AI Quality + Change Risk ------------------------------------------------

ai:sonar:
  <<: *ai_job
  stage: ai-review
  needs:
    - job: sonarqube
      optional: true
    - job: package
      artifacts: true
    - job: ai:tests
      artifacts: true
      optional: true
  script:
    - *resolve_app
    - |
      if [ -z "${AI_SCRIPT}" ]; then
        echo "AI script not found; skipping AI Quality Review"
        exit 0
      fi
      mkdir -p "${AI_OUT_DIR}"
      chmod +x "${AI_SCRIPT}"
      "${AI_SCRIPT}" sonar || true
  artifacts:
    when: always
    paths:
      - ai-review/
    expire_in: 1 week

ai:change:
  <<: *ai_job
  stage: ai-review
  needs:
    - job: package
      artifacts: true
    - job: ai:sonar
      artifacts: true
      optional: true
  script:
    - *resolve_app
    - |
      if [ -z "${AI_SCRIPT}" ]; then
        echo "AI script not found; skipping AI Change Risk"
        exit 0
      fi
      mkdir -p "${AI_OUT_DIR}"
      chmod +x "${AI_SCRIPT}"
      "${AI_SCRIPT}" change || true
  artifacts:
    when: always
    paths:
      - ai-review/
    expire_in: 1 week

# --- Publish -----------------------------------------------------------------

.publish_rules: &publish_rules
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish:artifacts:
  stage: publish
  <<: *publish_rules
  needs:
    - job: package
      artifacts: true
  script:
    - *resolve_app
    - mkdir -p artifacts
    - cp "${APP_DIR}/target/${ARTIFACT_ID}"-*.jar artifacts/
    - ls -lh artifacts/
  artifacts:
    name: "${ARTIFACT_ID}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"
    expire_in: 30 days
    paths:
      - artifacts/*.jar

publish:package-registry:
  stage: publish
  <<: *publish_rules
  needs:
    - job: package
      artifacts: true
  script:
    - *resolve_app
    - >
      cd "${APP_DIR}" && mvn $MAVEN_CLI_OPTS -DskipTests deploy
      --settings ci/maven-settings.xml
      -DaltDeploymentRepository=gitlab-maven::default::${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven

publish:s3:
  stage: publish
  image:
    name: amazon/aws-cli:2.22.35
    entrypoint: [""]
  needs:
    - job: package
      artifacts: true
    - job: ai:change
      artifacts: true
      optional: true
    - job: ai:sonar
      artifacts: true
      optional: true
    - job: ai:tests
      artifacts: true
      optional: true
  script:
    - |
      set -euo pipefail
      cd "${CI_PROJECT_DIR}"
      if [ -z "${S3_BUCKET:-}" ]; then
        echo "S3_BUCKET must be set as a CI/CD variable (terraform -chdir=deploy-vm output -raw ci_artifacts_bucket)"
        exit 1
      fi
      if [ -f sample-java-app/pom.xml ]; then APP_DIR=sample-java-app; else APP_DIR=.; fi
      export AWS_DEFAULT_REGION="${AWS_REGION:-us-east-1}"
      S3_PREFIX="sample-java-app/${CI_PIPELINE_IID}"
      aws sts get-caller-identity
      test -f "${APP_DIR}/target/${JAR_NAME}"
      aws s3 cp "${APP_DIR}/target/${JAR_NAME}" \
        "s3://${S3_BUCKET}/${S3_PREFIX}/" \
        --only-show-errors
      if [ -d "${APP_DIR}/target/surefire-reports" ]; then
        aws s3 cp "${APP_DIR}/target/surefire-reports/" \
          "s3://${S3_BUCKET}/${S3_PREFIX}/surefire-reports/" \
          --recursive --only-show-errors
      fi
      if [ -d "${CI_PROJECT_DIR}/ai-review" ]; then
        aws s3 cp "${CI_PROJECT_DIR}/ai-review/" \
          "s3://${S3_BUCKET}/${S3_PREFIX}/ai-review/" \
          --recursive --only-show-errors
      fi
      aws s3 ls "s3://${S3_BUCKET}/${S3_PREFIX}/"
  artifacts:
    when: always
    paths:
      - ai-review/
    expire_in: 1 week
  rules:
    - if: $S3_BUCKET
