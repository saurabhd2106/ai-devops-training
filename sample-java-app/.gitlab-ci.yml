# GitLab CI for sonarqube-java-demo
# Required CI/CD variables (Settings → CI/CD → Variables):
#   SONAR_HOST_URL  — e.g. http://<sonarqube-host>:9000
#   SONAR_TOKEN     — SonarQube user/project token (masked)
# Optional:
#   SONAR_PROJECT_KEY — defaults to sonarqube-java-demo

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - build
  - test
  - sonarqube
  - publish

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --show-version --no-transfer-progress"
  ARTIFACT_ID: "sonarqube-java-demo"
  FF_USE_FASTZIP: "true"

default:
  image: maven:3.9-eclipse-temurin-26
  interruptible: true
  cache:
    key: "maven-${CI_COMMIT_REF_SLUG}"
    paths:
      - .m2/repository

# --- Build -------------------------------------------------------------------

build:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests compile
  artifacts:
    name: "classes-${CI_COMMIT_SHORT_SHA}"
    expire_in: 1 day
    paths:
      - target/classes/
      - pom.xml

# --- Test --------------------------------------------------------------------

test:
  stage: test
  needs:
    - job: build
      artifacts: true
  script:
    # pom.xml sets surefire testFailureIgnore=true because this demo seeds a failing test.
    # JUnit reports are still collected and shown in the GitLab pipeline UI.
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    name: "tests-${CI_COMMIT_SHORT_SHA}"
    expire_in: 1 week
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/classes/
      - target/test-classes/
      - target/surefire-reports/

# --- SonarQube ---------------------------------------------------------------

sonarqube:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  needs:
    - job: test
      artifacts: true
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-${CI_COMMIT_REF_SLUG}"
    paths:
      - .sonar/cache
  script:
    - |
      if [ -z "${SONAR_HOST_URL}" ] || [ -z "${SONAR_TOKEN}" ]; then
        echo "SONAR_HOST_URL and SONAR_TOKEN must be set as CI/CD variables."
        exit 1
      fi
    - >
      sonar-scanner
      -Dsonar.host.url="${SONAR_HOST_URL}"
      -Dsonar.token="${SONAR_TOKEN}"
      -Dsonar.projectKey="${SONAR_PROJECT_KEY:-sonarqube-java-demo}"
      -Dsonar.projectName="${SONAR_PROJECT_KEY:-sonarqube-java-demo}"
      -Dsonar.sources=src/main/java
      -Dsonar.tests=src/test/java
      -Dsonar.java.binaries=target/classes
      -Dsonar.java.test.binaries=target/test-classes
      -Dsonar.junit.reportPaths=target/surefire-reports
      -Dsonar.sourceEncoding=UTF-8
      -Dsonar.qualitygate.wait=true
  allow_failure: true
  rules:
    - if: $SONAR_HOST_URL && $SONAR_TOKEN

# --- Publish -----------------------------------------------------------------

.publish_rules: &publish_rules
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish:artifacts:
  stage: publish
  <<: *publish_rules
  needs:
    - job: test
      artifacts: false
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests package
    - mkdir -p artifacts
    - cp target/${ARTIFACT_ID}-*.jar artifacts/
    - ls -lh artifacts/
  artifacts:
    name: "${ARTIFACT_ID}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"
    expire_in: 30 days
    paths:
      - artifacts/*.jar

publish:package-registry:
  stage: publish
  <<: *publish_rules
  needs:
    - job: test
      artifacts: false
  script:
    - >
      mvn $MAVEN_CLI_OPTS -DskipTests deploy
      --settings ci/maven-settings.xml
      -DaltDeploymentRepository=gitlab-maven::default::${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven
