# GitLab CI for sample-java-app (sonarqube-java-demo)
#
# Configure this file as the project CI/CD configuration file:
#   Settings → CI/CD → General pipelines → CI/CD configuration file
#   - Project root is sample-java-app/: sample-java-app.gitlab-ci.yml
#   - Workspace is project root:        sample-java-app/sample-java-app.gitlab-ci.yml
#
# Required CI/CD variables:
#   SONAR_HOST_URL  — e.g. http://<sonarqube-public-ip>:9000
#   SONAR_TOKEN     — SonarQube user token (masked)

stages:
  - build
  - test
  - sonar
  - publish

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B -e --no-transfer-progress"
  APP_JAR: "sonarqube-java-demo-0.0.1-SNAPSHOT.jar"

.maven_cache: &maven_cache
  cache:
    key: "$CI_COMMIT_REF_SLUG-maven"
    paths:
      - .m2/repository

.maven_job: &maven_job
  image: maven:3.9-eclipse-temurin-26
  <<: *maven_cache

build:
  <<: *maven_job
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests package
  artifacts:
    paths:
      - target/
    expire_in: 1 day

test:
  <<: *maven_job
  stage: test
  needs:
    - job: build
      artifacts: true
  script:
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 1 week

sonar:
  <<: *maven_job
  stage: sonar
  needs:
    - job: build
      artifacts: true
    - job: test
  script:
    - |
      if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_TOKEN" ]; then
        echo "SONAR_HOST_URL and SONAR_TOKEN must be set in CI/CD variables."
        exit 1
      fi
    - >
      mvn $MAVEN_CLI_OPTS sonar:sonar
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.projectKey=sonarqube-java-demo
      -Dsonar.projectName=sonarqube-java-demo
      -Dsonar.java.binaries=target/classes
      -Dsonar.sources=src/main/java
      -Dsonar.tests=src/test/java
  # Quality Gate wait intentionally omitted: this is a training demo with seeded issues.

publish:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs:
    - job: build
      artifacts: true
    - job: sonar
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" \
        > /kaniko/.docker/config.json
  script:
    - |
      DESTINATIONS="--destination ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      DESTINATIONS="${DESTINATIONS} --destination ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        DESTINATIONS="${DESTINATIONS} --destination ${CI_REGISTRY_IMAGE}:latest"
      fi
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --cache=true \
        ${DESTINATIONS}
