apiVersion: v1
kind: Service
metadata:
  name: sonarqube-java-demo
  labels:
    app: sonarqube-java-demo
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: sonarqube-java-demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
